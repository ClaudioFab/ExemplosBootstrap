<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verde Viva | Plantas & Jardinagem</title>
    <!-- Para conectar ao bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Para colocar icones -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>

<body>
    <!-- NAVBAR in ------------------------------------------------------------------->
    <nav class="navbar navbar-expand-lg bg-success navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-flower1 me-2"></i>Verde Viva</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto">
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active " aria-current="page" href="#inicio">Incio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active " aria-current="page" href="#categoria">Categoria</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active " aria-current="page" href="#produtos">Produtos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active " aria-current="page" href="#duvidas">Dúvidas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#contatos">Contatos</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>


    <main>
        <!-- CAROUSEL in ------------------------------------------------------------------->
        <section id="inicio">
            <div id="carouselExample" class="carousel slide">
                <div class="carousel-inner">
                    <!-- Carousel 01 ------------------------------------->
                    <div class="carousel-item active bg-success text-white text-center p-5">
                        <h1>Deixe sua casa mais verde.</h1>
                        <p class="fs-5">Platas selecionadas para transformar seus ambientes.</p>
                        <a href="#produtos" class="btn btn-light" >Conhecer produtos</a>
                        
                    </div>

                    <!-- Carousel 02 ------------------------------------->
                    <div class="carousel-item active bg-warning text-dark text-center p-5">
                        <h1>Semana dos vasos.</h1>
                        <p class="fs-5">Ofertas especiais em vasos e acessórios.</p>
                        <a href="#produtos" class="btn btn-dark" >Ver ofertas</a>
                    </div>


                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>


        </section>




    </main>


    <!-- Para conectar ao bootstrap -->
    <!-- Incluir Bootstrap JS --------------------------->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
